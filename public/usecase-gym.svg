<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="gm-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1F3A5F"/>
      <stop offset="100%" stop-color="#0A2540"/>
    </linearGradient>
    <radialGradient id="gm-glow" cx="0.7" cy="0.25" r="0.55">
      <stop offset="0%" stop-color="#C97B5A" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#C97B5A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#gm-bg)"/>
  <rect width="1200" height="1500" fill="url(#gm-glow)"/>
  <!-- Floor line -->
  <rect x="0" y="1080" width="1200" height="420" fill="#06192E"/>
  <!-- Mirror -->
  <rect x="120" y="220" width="640" height="780" rx="4" fill="#1a2f4d" stroke="#C9A961" stroke-width="3"/>
  <!-- Reflection -->
  <rect x="135" y="235" width="610" height="750" fill="url(#gm-glow)" opacity="0.5"/>
  <!-- Barbell silhouette -->
  <g fill="#C97B5A">
    <rect x="280" y="1130" width="560" height="14" rx="7"/>
    <rect x="240" y="1100" width="60" height="80" rx="6"/>
    <rect x="820" y="1100" width="60" height="80" rx="6"/>
    <circle cx="270" cy="1140" r="40" fill="#1a2f4d" stroke="#C97B5A" stroke-width="6"/>
    <circle cx="850" cy="1140" r="40" fill="#1a2f4d" stroke="#C97B5A" stroke-width="6"/>
  </g>
  <!-- Dumbbells -->
  <g fill="#F7F4EE" opacity="0.6">
    <rect x="900" y="1230" width="220" height="12" rx="6"/>
    <circle cx="900" cy="1236" r="20"/>
    <circle cx="1120" cy="1236" r="20"/>
    <rect x="930" y="1290" width="180" height="10" rx="5"/>
    <circle cx="930" cy="1295" r="16"/>
    <circle cx="1110" cy="1295" r="16"/>
  </g>
</svg>
