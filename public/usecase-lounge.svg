<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="lg-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2c22"/>
      <stop offset="100%" stop-color="#1a110a"/>
    </linearGradient>
    <radialGradient id="lg-glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#C9A961" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#C9A961" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#lg-bg)"/>
  <rect width="1200" height="1500" fill="url(#lg-glow)"/>
  <!-- Bar back wall (slats) -->
  <g fill="#5a4334" opacity="0.7">
    <rect x="100" y="200" width="1000" height="600" rx="8"/>
  </g>
  <g stroke="#3a2c22" stroke-width="3">
    <line x1="100" y1="250" x2="1100" y2="250"/>
    <line x1="100" y1="320" x2="1100" y2="320"/>
    <line x1="100" y1="390" x2="1100" y2="390"/>
    <line x1="100" y1="460" x2="1100" y2="460"/>
    <line x1="100" y1="530" x2="1100" y2="530"/>
    <line x1="100" y1="600" x2="1100" y2="600"/>
    <line x1="100" y1="670" x2="1100" y2="670"/>
    <line x1="100" y1="740" x2="1100" y2="740"/>
  </g>
  <!-- Bottles -->
  <g fill="#C9A961">
    <rect x="280" y="380" width="40" height="180" rx="8"/>
    <rect x="350" y="360" width="36" height="200" rx="6"/>
    <rect x="410" y="400" width="42" height="160" rx="8"/>
    <rect x="480" y="370" width="38" height="190" rx="7"/>
    <rect x="550" y="390" width="40" height="170" rx="7"/>
  </g>
  <g fill="#C97B5A">
    <rect x="620" y="380" width="40" height="180" rx="8"/>
    <rect x="690" y="360" width="36" height="200" rx="6"/>
    <rect x="760" y="400" width="42" height="160" rx="8"/>
    <rect x="830" y="370" width="38" height="190" rx="7"/>
  </g>
  <!-- Bar counter -->
  <rect x="50" y="900" width="1100" height="60" rx="6" fill="#0A2540"/>
  <rect x="50" y="960" width="1100" height="160" fill="#16100a"/>
  <!-- Stools -->
  <g fill="#C97B5A">
    <circle cx="280" cy="1170" r="40"/>
    <rect x="270" y="1170" width="20" height="180" fill="#0A2540"/>
    <circle cx="600" cy="1170" r="40"/>
    <rect x="590" y="1170" width="20" height="180" fill="#0A2540"/>
    <circle cx="920" cy="1170" r="40"/>
    <rect x="910" y="1170" width="20" height="180" fill="#0A2540"/>
  </g>
</svg>
