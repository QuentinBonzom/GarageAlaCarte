<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1500" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="st-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4bfa3"/>
      <stop offset="100%" stop-color="#8a7660"/>
    </linearGradient>
    <radialGradient id="st-glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#FFFDF8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFFDF8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="1500" fill="url(#st-bg)"/>
  <rect width="1200" height="1500" fill="url(#st-glow)"/>
  <!-- Wall cabinetry grid -->
  <g fill="#3a2c22">
    <!-- Top row -->
    <rect x="100" y="160" width="280" height="380" rx="6"/>
    <rect x="400" y="160" width="280" height="380" rx="6"/>
    <rect x="700" y="160" width="280" height="380" rx="6"/>
    <rect x="1000" y="160" width="100" height="380" rx="6" opacity="0.7"/>
    <!-- Middle row -->
    <rect x="100" y="560" width="180" height="280" rx="6"/>
    <rect x="300" y="560" width="380" height="280" rx="6"/>
    <rect x="700" y="560" width="180" height="280" rx="6"/>
    <rect x="900" y="560" width="200" height="280" rx="6" opacity="0.85"/>
    <!-- Bottom row -->
    <rect x="100" y="860" width="500" height="200" rx="6"/>
    <rect x="620" y="860" width="280" height="200" rx="6"/>
    <rect x="920" y="860" width="180" height="200" rx="6" opacity="0.85"/>
  </g>
  <!-- Handles -->
  <g fill="#C9A961">
    <rect x="225" y="345" width="30" height="6" rx="2"/>
    <rect x="525" y="345" width="30" height="6" rx="2"/>
    <rect x="825" y="345" width="30" height="6" rx="2"/>
    <rect x="180" y="695" width="20" height="6" rx="2"/>
    <rect x="480" y="695" width="20" height="6" rx="2"/>
    <rect x="780" y="695" width="20" height="6" rx="2"/>
    <rect x="340" y="955" width="20" height="6" rx="2"/>
    <rect x="755" y="955" width="20" height="6" rx="2"/>
  </g>
  <!-- Bikes on hooks (silhouette) -->
  <g stroke="#0A2540" stroke-width="6" fill="none" opacity="0.7">
    <circle cx="1020" cy="280" r="44"/>
    <circle cx="1140" cy="280" r="44"/>
    <path d="M1020 280 L1080 200 L1140 280 M1080 200 L1080 280"/>
  </g>
  <!-- Floor -->
  <rect x="0" y="1100" width="1200" height="400" fill="#6f5b44"/>
  <!-- EV charger -->
  <rect x="500" y="1140" width="80" height="220" rx="10" fill="#0A2540"/>
  <rect x="520" y="1170" width="40" height="60" rx="4" fill="#C97B5A"/>
  <text x="540" y="1380" text-anchor="middle" fill="#F7F4EE" font-family="monospace" font-size="14" letter-spacing="2">EV</text>
</svg>
