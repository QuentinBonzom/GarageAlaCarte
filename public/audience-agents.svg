<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ag-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5a4334"/>
      <stop offset="55%" stop-color="#3a2c22"/>
      <stop offset="100%" stop-color="#1f1812"/>
    </linearGradient>
    <linearGradient id="ag-key" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd5b3"/>
      <stop offset="100%" stop-color="#ffb88c"/>
    </linearGradient>
    <radialGradient id="ag-spot" cx="0.32" cy="0.45" r="0.45">
      <stop offset="0%" stop-color="#ffb88c" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ffb88c" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#ag-bg)"/>
  <rect width="1200" height="800" fill="url(#ag-spot)"/>

  <!-- Faint window grid (apartment building hint) -->
  <g fill="#ffd5b3" opacity="0.06">
    <rect x="780" y="120" width="38" height="58"/>
    <rect x="836" y="120" width="38" height="58"/>
    <rect x="892" y="120" width="38" height="58"/>
    <rect x="948" y="120" width="38" height="58"/>
    <rect x="1004" y="120" width="38" height="58"/>
    <rect x="780" y="200" width="38" height="58"/>
    <rect x="836" y="200" width="38" height="58"/>
    <rect x="892" y="200" width="38" height="58"/>
    <rect x="948" y="200" width="38" height="58"/>
    <rect x="1004" y="200" width="38" height="58"/>
    <rect x="780" y="280" width="38" height="58"/>
    <rect x="836" y="280" width="38" height="58"/>
    <rect x="892" y="280" width="38" height="58"/>
    <rect x="948" y="280" width="38" height="58"/>
    <rect x="1004" y="280" width="38" height="58"/>
  </g>

  <!-- Stylised key -->
  <g fill="url(#ag-key)">
    <!-- Bow (round head) -->
    <circle cx="340" cy="400" r="132"/>
    <!-- Shaft -->
    <rect x="340" y="380" width="500" height="40"/>
    <!-- Teeth -->
    <rect x="780" y="380" width="22" height="78"/>
    <rect x="740" y="380" width="22" height="56"/>
    <rect x="700" y="380" width="22" height="40"/>
  </g>
  <!-- Bow inner hole -->
  <circle cx="340" cy="400" r="58" fill="#3a2c22"/>
  <!-- Decorative ring inside bow -->
  <circle cx="340" cy="400" r="92" fill="none" stroke="#3a2c22" stroke-width="6" opacity="0.55"/>

  <!-- Subtle horizon line -->
  <rect x="0" y="720" width="1200" height="80" fill="#0a2540" opacity="0.35"/>
</svg>
