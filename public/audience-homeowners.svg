<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="ho-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe3c4"/>
      <stop offset="60%" stop-color="#e3bf8a"/>
      <stop offset="100%" stop-color="#a88962"/>
    </linearGradient>
    <radialGradient id="ho-glow" cx="0.72" cy="0.78" r="0.55">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ff8e3c" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ff8e3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ho-house" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1f17"/>
      <stop offset="100%" stop-color="#0a2540"/>
    </linearGradient>
    <linearGradient id="ho-window" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166"/>
      <stop offset="100%" stop-color="#ff8e3c"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#ho-bg)"/>
  <rect width="1200" height="800" fill="url(#ho-glow)"/>

  <!-- Distant ground line -->
  <rect x="0" y="640" width="1200" height="160" fill="#0a2540" opacity="0.12"/>

  <!-- House silhouette -->
  <g fill="url(#ho-house)">
    <!-- Main body -->
    <path d="M320,420 L320,660 L560,660 L560,420 L440,300 Z"/>
    <!-- Garage extension -->
    <rect x="560" y="470" width="320" height="190"/>
    <!-- Chimney -->
    <rect x="380" y="340" width="34" height="80"/>
  </g>

  <!-- Lit windows (cozy interior light) -->
  <rect x="400" y="470" width="80" height="100" fill="url(#ho-window)" opacity="0.92"/>
  <rect x="408" y="478" width="30" height="42" fill="#fff8f0" opacity="0.18"/>
  <rect x="442" y="478" width="30" height="42" fill="#fff8f0" opacity="0.18"/>

  <!-- Garage door (open, glowing) -->
  <rect x="600" y="520" width="240" height="140" fill="url(#ho-window)" opacity="0.85"/>
  <rect x="600" y="520" width="240" height="6" fill="#fff8f0" opacity="0.25"/>
  <rect x="600" y="558" width="240" height="3" fill="#fff8f0" opacity="0.18"/>
  <rect x="600" y="595" width="240" height="3" fill="#fff8f0" opacity="0.18"/>
  <rect x="600" y="632" width="240" height="3" fill="#fff8f0" opacity="0.18"/>

  <!-- Path / driveway tone -->
  <path d="M600,660 L840,660 L900,800 L540,800 Z" fill="#0a2540" opacity="0.18"/>
</svg>
