<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="dv-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4bfa3"/>
      <stop offset="50%" stop-color="#a89378"/>
      <stop offset="100%" stop-color="#6f5b44"/>
    </linearGradient>
    <linearGradient id="dv-glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dv-building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16365b"/>
      <stop offset="100%" stop-color="#0a2540"/>
    </linearGradient>
    <linearGradient id="dv-building-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f4476"/>
      <stop offset="100%" stop-color="#0e2a4a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="800" fill="url(#dv-bg)"/>
  <rect x="0" y="0" width="1200" height="320" fill="url(#dv-glow)"/>

  <!-- Back row (slightly faded) -->
  <g fill="#0a2540" opacity="0.45">
    <rect x="60" y="380" width="120" height="380"/>
    <rect x="200" y="320" width="100" height="440"/>
    <rect x="320" y="420" width="80" height="340"/>
    <rect x="420" y="280" width="120" height="480"/>
    <rect x="560" y="360" width="90" height="400"/>
    <rect x="670" y="240" width="110" height="520"/>
    <rect x="800" y="340" width="100" height="420"/>
    <rect x="920" y="300" width="130" height="460"/>
    <rect x="1070" y="380" width="80" height="380"/>
  </g>

  <!-- Front row (sharper) -->
  <g fill="url(#dv-building)">
    <rect x="120" y="500" width="140" height="260"/>
    <rect x="280" y="440" width="160" height="320"/>
    <rect x="460" y="500" width="140" height="260"/>
    <rect x="620" y="400" width="180" height="360"/>
    <rect x="820" y="460" width="150" height="300"/>
    <rect x="990" y="430" width="160" height="330"/>
  </g>

  <!-- Mid-tone accents on front buildings -->
  <g fill="url(#dv-building-mid)">
    <rect x="280" y="440" width="50" height="320"/>
    <rect x="620" y="400" width="60" height="360"/>
    <rect x="990" y="430" width="55" height="330"/>
  </g>

  <!-- Lit windows -->
  <g fill="#ffd166" opacity="0.85">
    <rect x="150" y="540" width="14" height="20"/>
    <rect x="180" y="540" width="14" height="20"/>
    <rect x="210" y="540" width="14" height="20"/>
    <rect x="150" y="585" width="14" height="20"/>
    <rect x="210" y="585" width="14" height="20"/>
    <rect x="320" y="480" width="16" height="24"/>
    <rect x="356" y="480" width="16" height="24"/>
    <rect x="392" y="480" width="16" height="24"/>
    <rect x="320" y="540" width="16" height="24"/>
    <rect x="392" y="540" width="16" height="24"/>
    <rect x="490" y="540" width="14" height="20"/>
    <rect x="520" y="540" width="14" height="20"/>
    <rect x="550" y="540" width="14" height="20"/>
    <rect x="660" y="440" width="18" height="26"/>
    <rect x="700" y="440" width="18" height="26"/>
    <rect x="740" y="440" width="18" height="26"/>
    <rect x="660" y="500" width="18" height="26"/>
    <rect x="740" y="500" width="18" height="26"/>
    <rect x="850" y="500" width="16" height="22"/>
    <rect x="884" y="500" width="16" height="22"/>
    <rect x="918" y="500" width="16" height="22"/>
    <rect x="1020" y="480" width="16" height="24"/>
    <rect x="1056" y="480" width="16" height="24"/>
    <rect x="1092" y="480" width="16" height="24"/>
    <rect x="1020" y="540" width="16" height="24"/>
    <rect x="1092" y="540" width="16" height="24"/>
  </g>

  <!-- Foreground shadow -->
  <rect x="0" y="730" width="1200" height="70" fill="#0a2540" opacity="0.45"/>
</svg>
